spring.application.name=asteroid-alerting
server.port=${PORT:8080}

nasa.neo.api.url=https://api.nasa.gov/neo/rest/v1/feed
nasa.api.key=${NASA_API_KEY:DEMO_KEY}

# Delivery mode: "kafka" (default for local Docker/Kafka) or "http" (for free-tier cloud without Kafka)
alert.delivery.mode=${ALERT_DELIVERY_MODE:kafka}
notification.service.url=${NOTIFICATION_SERVICE_URL:http://localhost:8081}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://*.vercel.app}

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.template.default-topic=asteroid-alert
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.web.error.include-message=always
