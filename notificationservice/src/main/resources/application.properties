spring.application.name=notificationservice
server.port=${PORT:8081}

# Delivery mode: "kafka" (default) or "http" (when receiving REST dispatches without Kafka)
alert.delivery.mode=${ALERT_DELIVERY_MODE:kafka}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.template.default-topic=asteroid-alert
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.JsonSerializer

# Option A: Google Apps Script HTTPS Webhook (free, works on Render Free without custom domain)
email.webhook.url=${EMAIL_WEBHOOK_URL:}
email.webhook.secret=${EMAIL_WEBHOOK_SECRET:}

# Option B: Brevo HTTPS API (requires authenticated custom domain)
brevo.api.key=${BREVO_API_KEY:}

# Option C: SMTP / Gmail fallback (for local runs)
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

email.service.from.email=${MAIL_FROM:${MAIL_USERNAME:anuraggautam3395@gmail.com}}
