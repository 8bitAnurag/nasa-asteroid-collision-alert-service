services:
  - type: web
    name: asteroid-notification-service
    runtime: docker
    plan: free
    rootDir: notificationservice
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/notifications/health
    envVars:
      - key: ALERT_DELIVERY_MODE
        value: http
      - key: EMAIL_WEBHOOK_URL
        sync: false
      - key: BREVO_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false

  - type: web
    name: asteroid-alerting-service
    runtime: docker
    plan: free
    rootDir: asteroidalerting
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/asteroid-alerting/health
    envVars:
      - key: ALERT_DELIVERY_MODE
        value: http
      - key: NOTIFICATION_SERVICE_URL
        value: https://asteroid-notification-service.onrender.com
      - key: NASA_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
