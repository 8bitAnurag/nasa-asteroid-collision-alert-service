services:
  - type: web
    name: asteroid-notification-service
    runtime: docker
    plan: free
    rootDir: notificationservice
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/notifications/health
    envVars:
      - key: ALERT_DELIVERY_MODE
        value: http
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false

  - type: web
    name: asteroid-alerting-service
    runtime: docker
    plan: free
    rootDir: asteroidalerting
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/v1/asteroid-alerting/health
    envVars:
      - key: ALERT_DELIVERY_MODE
        value: http
      - key: NOTIFICATION_SERVICE_URL
        fromService:
          type: web
          name: asteroid-notification-service
          property: url
      - key: NASA_API_KEY
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        value: https://*.vercel.app,http://localhost:5173
